+PART[proceduralTankLiquid]:FIRST:NEEDS[ProceduralParts]
{
    @name = narakaProceduralAvionics
    @title = #LOC_NPA_Part_Title
    @manufacturer = #LOC_NPA_Part_Manufacturer
    @description = #LOC_NPA_Part_Description
    @category = Pods
    @subcategory = 0
    @TechRequired = engineering101
    @entryCost = 5000
    @cost = 850
    %vesselType = Probe
    %CrewCapacity = 0
    %bulkheadProfiles = size0,size1,srf

    !RESOURCE,* {}
    !MODULE[TankContentSwitcher],* {}
    !MODULE[ModuleFuelTanks],* {}
    !MODULE[ModuleFuelTanksRF],* {}
    !MODULE[InterstellarFuelSwitch],* {}
    !MODULE[FSfuelSwitch],* {}

    @MODULE[ProceduralPart]
    {
        %diameterMin = 0.10
        %lengthMin = 0.05
        %volumeMin = 0.0005
    }

    MODULE
    {
        name = ModuleCommand
        minimumCrew = 0
        hasHibernation = true
        hibernationMultiplier = 0.05
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.025
        }
    }

    MODULE
    {
        name = ModuleSAS
        SASServiceLevel = 1
    }

    RESOURCE
    {
        name = ElectricCharge
        amount = 100
        maxAmount = 100
    }

    MODULE:NEEDS[!Kerbalism]
    {
        name = ModuleScienceContainer
        reviewActionName = #LOC_NPA_Review_Data
        storeActionName = #LOC_NPA_Store_Data
        evaOnlyStorage = False
        storageRange = 2.0
        canBeTransferredToInVessel = True
        canTransferInVessel = True
    }

    MODULE:NEEDS[!Kerbalism]
    {
        name = ModuleScienceExperiment
        experimentID = narakaFlightTelemetry
        experimentActionName = #LOC_NPA_Telemetry_Action
        resetActionName = #LOC_NPA_Telemetry_Reset
        useStaging = False
        useActionGroups = True
        hideUIwhenUnavailable = True
        xmitDataScalar = 1.0
        dataIsCollectable = True
        collectActionName = #LOC_NPA_Telemetry_Collect
        rerunnable = True
    }

    tags = procedural avionics probe core guidance computer telemetry science battery naraka
}

@PART[narakaProceduralAvionics]:NEEDS[RealismOverhaul]:BEFORE[RealismOverhaul]
{
    %RSSROConfig = True
    %useAntennaConfig = InternalComms
    %reactionWheelMode = wheel
    %reactionWheelPowerDraw = 0.050
}

@PART[narakaProceduralAvionics]:NEEDS[RealFuels,RealismOverhaul]:BEFORE[RealismOverhaulTankTypes]
{
    !RESOURCE[ElectricCharge],* {}
    !MODULE[ModuleFuelTanks],* {}
    %roTankType = battery

    MODULE
    {
        name = ModuleFuelTanks
        volume = 600
        utilizationTweakable = true
        utilization = 100
        maxUtilization = 100
    }

    @MODULE[ProceduralPart]
    {
        %costPerkL = 0.00957
    }
}

@PART[narakaProceduralAvionics]:NEEDS[RealFuels,!RealismOverhaul]:AFTER[RealFuels]
{
    !RESOURCE[ElectricCharge],* {}
    !MODULE[ModuleFuelTanks],* {}

    MODULE
    {
        name = ModuleFuelTanks
        volume = 600
        utilizationTweakable = true
        type = ServiceModule
        typeAvailable = ServiceModule
    }
}

@PART[narakaProceduralAvionics]:NEEDS[!RealismOverhaul]:AFTER[ProceduralParts]
{
    MODULE
    {
        name = ModuleReactionWheel
        PitchTorque = 0.05
        YawTorque = 0.05
        RollTorque = 0.05
        RESOURCE
        {
            name = ElectricCharge
            rate = 0.05
        }
    }

    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = DIRECT
        packetInterval = 0.6
        packetSize = 2
        packetResourceCost = 10
        requiredResource = ElectricCharge
        antennaPower = 500000
        antennaCombinable = True
        antennaCombinableExponent = 1
    }
}

@PART[narakaProceduralAvionics]:HAS[!MODULE[ModuleDataTransmitter]]:NEEDS[RealismOverhaul,!RemoteTech]:AFTER[RealismOverhaul]
{
    MODULE
    {
        name = ModuleDataTransmitter
        antennaType = INTERNAL
        packetInterval = 1.0
        packetSize = 2.0
        packetResourceCost = 0.005
        requiredResource = ElectricCharge
        antennaPower = 65000
        antennaCombinable = false
    }
}
