@PART[narakaProceduralAvionics]:NEEDS[Kerbalism,FeatureScience]:FINAL
{
    !MODULE[ModuleScienceContainer],* {}
    !MODULE[HardDrive],* {}
    !MODULE[Configure]:HAS[#narakaProceduralAvionicsConfigure[true]],* {}
    !MODULE[Experiment]:HAS[#integratedAvionicsExperiment[true]],* {}
    !MODULE[ModuleScienceExperiment]:HAS[#experimentID[telemetryReport]],* {}
    !MODULE[Experiment]:HAS[#experiment_id[telemetryReport]],* {}

    MODULE
    {
        name = HardDrive
        title = #LOC_NPA_Data_Storage
        dataCapacity = 4
        sampleCapacity = 1

        UPGRADES
        {
            UPGRADE
            {
                name__ = NPAStorageEarly
                techRequired__ = stability
                dataCapacity = 16
                sampleCapacity = 1
            }
            UPGRADE
            {
                name__ = NPAStorageDeveloped
                techRequired__ = basicScience
                dataCapacity = 64
                sampleCapacity = 2
            }
            UPGRADE
            {
                name__ = NPAStorageAdvanced
                techRequired__ = electronics
                dataCapacity = 256
                sampleCapacity = 4
            }
            UPGRADE
            {
                name__ = NPAStorageModern
                techRequired__ = scienceTech
                dataCapacity = 1024
                sampleCapacity = 6
            }
        }
    }

    MODULE
    {
        name = Experiment
        experiment_id = narakaFlightTelemetry
        integratedAvionicsExperiment = true
        data_rate = 0.001
        ec_rate = 0.002
        allow_shrouded = true
    }

    MODULE
    {
        name = Experiment
        experiment_id = temperatureScan
        integratedAvionicsExperiment = true
        data_rate = 0.002
        ec_rate = 0.001
        allow_shrouded = true
    }

    MODULE
    {
        name = Experiment
        experiment_id = barometerScan
        integratedAvionicsExperiment = true
        data_rate = 0.002
        ec_rate = 0.002
        allow_shrouded = true
    }

    MODULE
    {
        name = Experiment
        experiment_id = narakaGeigerCounter
        integratedAvionicsExperiment = true
        data_rate = 0.000555556
        ec_rate = 0.001
        allow_shrouded = true
    }

    MODULE
    {
        name = Experiment
        experiment_id = narakaBiologicalSample
        integratedAvionicsExperiment = true
        data_rate = 0.008333333
        ec_rate = 0.005
        allow_shrouded = true
        sample_collecting = true
        sample_amount = 1
    }

    MODULE
    {
        name = Experiment
        experiment_id = narakaMicrometeorite
        integratedAvionicsExperiment = true
        data_rate = 0.0000000625
        ec_rate = 0.001
        allow_shrouded = false
    }

    MODULE
    {
        name = Experiment
        experiment_id = narakaMassSpectrometry
        integratedAvionicsExperiment = true
        data_rate = 0.000000138889
        ec_rate = 0.002
        allow_shrouded = false
    }

    MODULE
    {
        name = Experiment
        experiment_id = gravityScan
        integratedAvionicsExperiment = true
        data_rate = 0.0015
        ec_rate = 0.005
        allow_shrouded = true
    }

    MODULE
    {
        name = Experiment
        experiment_id = atmosphereAnalysis
        integratedAvionicsExperiment = true
        data_rate = 0.003
        ec_rate = 0.02
        allow_shrouded = true
    }

    MODULE
    {
        name = Experiment
        experiment_id = magnetometer
        integratedAvionicsExperiment = true
        data_rate = 0.002
        ec_rate = 0.003
        allow_shrouded = true
    }

    MODULE
    {
        name = Configure
        title = #LOC_NPA_Integrated_Instruments
        slots = 2
        narakaProceduralAvionicsConfigure = true

        UPGRADES
        {
            UPGRADE
            {
                name__ = NPAInstrumentSlotsDeveloped
                techRequired__ = basicScience
                slots = 3
            }
            UPGRADE
            {
                name__ = NPAInstrumentSlotsAdvanced
                techRequired__ = electronics
                slots = 4
            }
            UPGRADE
            {
                name__ = NPAInstrumentSlotsModern
                techRequired__ = scienceTech
                slots = 5
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_None
            desc = #LOC_NPA_Setup_None_Desc
        }

        SETUP
        {
            name = #LOC_NPA_Setup_Temperature
            desc = #LOC_NPA_Setup_Temperature_Desc
            tech = #$@PART[sensorThermometer]/TechRequired$
            mass = #$@PART[sensorThermometer]/mass$
            cost = #$@PART[sensorThermometer]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = temperatureScan
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_Pressure
            desc = #LOC_NPA_Setup_Pressure_Desc
            tech = #$@PART[sensorBarometer]/TechRequired$
            mass = #$@PART[sensorBarometer]/mass$
            cost = #$@PART[sensorBarometer]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = barometerScan
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_Geiger
            desc = #LOC_NPA_Setup_Geiger_Desc
            tech = start
            mass = 0.005
            cost = 400
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = narakaGeigerCounter
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_BiologicalSample
            desc = #LOC_NPA_Setup_BiologicalSample_Desc
            tech = survivability
            mass = #$@PART[GooExperiment]/mass$
            cost = #$@PART[GooExperiment]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = narakaBiologicalSample
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_Micrometeorite
            desc = #LOC_NPA_Setup_Micrometeorite_Desc
            tech = basicScience
            mass = #$@PART[sensorAccelerometer]/mass$
            cost = #$@PART[sensorAccelerometer]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = narakaMicrometeorite
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_MassSpectrometer
            desc = #LOC_NPA_Setup_MassSpectrometer_Desc
            tech = electronics
            mass = 0.01
            cost = 1800
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = narakaMassSpectrometry
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_Gravity
            desc = #LOC_NPA_Setup_Gravity_Desc
            tech = #$@PART[sensorGravimeter]/TechRequired$
            mass = #$@PART[sensorGravimeter]/mass$
            cost = #$@PART[sensorGravimeter]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = gravityScan
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_Atmosphere
            desc = #LOC_NPA_Setup_Atmosphere_Desc
            tech = #$@PART[sensorAtmosphere]/TechRequired$
            mass = #$@PART[sensorAtmosphere]/mass$
            cost = #$@PART[sensorAtmosphere]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = atmosphereAnalysis
            }
        }

    }
}

@PART[narakaProceduralAvionics]:NEEDS[Kerbalism,FeatureScience,!DMagic]:FINAL
{
    @MODULE[Configure]:HAS[#narakaProceduralAvionicsConfigure[true]]
    {
        SETUP
        {
            name = #LOC_NPA_Setup_Magnetometer
            desc = #LOC_NPA_Setup_Magnetometer_Desc
            tech = #$@PART[Magnetometer]/TechRequired$
            mass = #$@PART[Magnetometer]/mass$
            cost = #$@PART[Magnetometer]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = magnetometer
            }
        }
    }
}
