@PART[narakaProceduralAvionics]:NEEDS[Kerbalism,FeatureScience,SpaceDust]:FINAL
{
    MODULE
    {
        name = ModuleSpaceDustScanner
        PowerCost = 0.3
        ScanInSpace = false
        SCANNED_RESOURCE
        {
            name = XenonGas
            DiscoverMode = Local
            IdentifyMode = Local
            DiscoverRange = 0
            IdentifyRange = 0
        }
        SCANNED_RESOURCE
        {
            name = LiquidFuel
            DiscoverMode = Local
            IdentifyMode = Local
            DiscoverRange = 0
            IdentifyRange = 0
        }
        SCANNED_RESOURCE
        {
            name = Oxidizer
            DiscoverMode = Local
            IdentifyMode = Local
            DiscoverRange = 0
            IdentifyRange = 0
        }
    }

    MODULE
    {
        name = ModuleSpaceDustScanner
        PowerCost = 2.2
        ScanInSpace = true
        SCANNED_RESOURCE
        {
            name = XenonGas
            DiscoverMode = Altitude
            IdentifyMode = Altitude
            DiscoverRange = 300000
            IdentifyRange = 100000
        }
        SCANNED_RESOURCE
        {
            name = LiquidFuel
            DiscoverMode = Altitude
            IdentifyMode = Altitude
            DiscoverRange = 300000
            IdentifyRange = 100000
        }
        SCANNED_RESOURCE
        {
            name = Oxidizer
            DiscoverMode = Altitude
            IdentifyMode = Altitude
            DiscoverRange = 300000
            IdentifyRange = 100000
        }
    }

    @MODULE[Configure]:HAS[#narakaProceduralAvionicsConfigure[true]]
    {
        SETUP
        {
            name = #LOC_NPA_Setup_SpaceDust_GasAnalyzer
            desc = #LOC_NPA_Setup_SpaceDust_GasAnalyzer_Desc
            tech = #$@PART[spacedust-gas-analyzer-1]/TechRequired$
            mass = #$@PART[spacedust-gas-analyzer-1]/mass$
            cost = #$@PART[spacedust-gas-analyzer-1]/cost$
            MODULE
            {
                type = ModuleSpaceDustScanner
                id_index = 0
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_SpaceDust_Spectrometer
            desc = #LOC_NPA_Setup_SpaceDust_Spectrometer_Desc
            tech = #$@PART[spacedust-spectrometer-1]/TechRequired$
            mass = #$@PART[spacedust-spectrometer-1]/mass$
            cost = #$@PART[spacedust-spectrometer-1]/cost$
            MODULE
            {
                type = ModuleSpaceDustScanner
                id_index = 1
            }
        }
    }
}

@PART[narakaProceduralAvionics]:NEEDS[Kerbalism,FeatureScience,SpaceDust,CommunityResourcePack,NearFuturePropulsion]:FINAL
{
    @MODULE[ModuleSpaceDustScanner],0
    {
        SCANNED_RESOURCE
        {
            name = ArgonGas
            DiscoverMode = Local
            IdentifyMode = Local
            DiscoverRange = 0
            IdentifyRange = 0
        }
    }
    @MODULE[ModuleSpaceDustScanner],1
    {
        SCANNED_RESOURCE
        {
            name = ArgonGas
            DiscoverMode = Altitude
            IdentifyMode = Altitude
            DiscoverRange = 300000
            IdentifyRange = 100000
        }
    }
}

