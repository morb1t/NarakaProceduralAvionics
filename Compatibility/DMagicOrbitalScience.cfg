@PART[narakaProceduralAvionics]:NEEDS[Kerbalism,FeatureScience,DMagic]:FINAL
{
    MODULE
    {
        name = Experiment
        experiment_id = dmRadiometerScan
        integratedAvionicsExperiment = true
        data_rate = 0.006
        ec_rate = 0.02
        allow_shrouded = false
    }

    MODULE
    {
        name = Experiment
        experiment_id = AnomalyScan
        integratedAvionicsExperiment = true
        data_rate = 0.07
        ec_rate = 1
        allow_shrouded = false
    }

    @MODULE[Configure]:HAS[#narakaProceduralAvionicsConfigure[true]]
    {
        SETUP
        {
            name = #LOC_NPA_Setup_DMagic_Radiometer
            desc = #LOC_NPA_Setup_DMagic_Radiometer_Desc
            tech = #$@PART[dmGoreSat]/TechRequired$
            mass = #$@PART[dmGoreSat]/mass$
            cost = #$@PART[dmGoreSat]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = dmRadiometerScan
            }
        }

        SETUP
        {
            name = #LOC_NPA_Setup_DMagic_Anomaly
            desc = #LOC_NPA_Setup_DMagic_Anomaly_Desc
            tech = #$@PART[dmAnomScanner]/TechRequired$
            mass = #$@PART[dmAnomScanner]/mass$
            cost = #$@PART[dmAnomScanner]/cost$
            MODULE
            {
                type = Experiment
                id_field = experiment_id
                id_value = AnomalyScan
            }
        }
    }
}
